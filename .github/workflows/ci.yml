name: ci
on:
  push:
    branches: [main, feat/**]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Docker files present
        run: test -f docker-compose.dev.yml && test -f docker-compose.gpu.yml
