# v0.1: web process is the modular monolith (UI + REST + MCP + pixel workers).
# GPU worker lives in docker-compose.gpu.yml (Python 3.12 + PyTorch, honest CUDA probe).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: framelab
      POSTGRES_PASSWORD: framelab
      POSTGRES_DB: framelab
    ports:
      - "5432:5432"
    volumes:
      - framelab_pg:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  web:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "npm install && npm run dev"
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://framelab:framelab@postgres:5432/framelab
    depends_on:
      - postgres
      - redis

volumes:
  framelab_pg:
